<script src="../../vendor/react-dom.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>.site-header{position:sticky;top:0;z-index:20;border-width:0 0 1px!important;border-bottom-color:var(--border-translucent)!important}
.site-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--bdw-cocoa)}.site-brand:hover{color:var(--bdw-cocoa)}
.site-link{position:relative;padding:10px 14px;border-radius:999px;color:var(--text-body);text-decoration:none;font-weight:800;font-size:15px;transition:background var(--motion-micro) var(--ease-default),color var(--motion-micro) var(--ease-default)}
.site-link:hover{background:rgba(0,96,149,.08);color:var(--bdw-deep-walk)}.site-link.is-active{color:var(--bdw-deep-walk)}.site-link.is-active::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;border-radius:2px;background:var(--bdw-deep-walk)}
.foot-link{color:var(--bdw-warm-cream);font-size:14px;font-weight:700;text-decoration:none;padding:8px 12px;border-radius:999px;transition:background var(--duration-fast) var(--ease-premium)}.foot-link:hover{color:var(--bdw-warm-cream);background:rgba(255,249,234,.10)}.foot-link:focus-visible{outline-color:var(--bdw-sunshine)}
.hero-art{position:relative;justify-self:center;width:min(440px,100%)}
.hero-float{position:absolute;font:800 14px/1 var(--font-sans)}
.hero-spark{right:-2%;top:4%}
.hero-chip{right:-6%;bottom:22%}
.hero-label-wrap{position:absolute;left:-4%;bottom:4%}
.hero-label{display:inline-block;background:var(--bdw-sunshine);border-radius:999px;padding:10px 22px;font:700 22px/1 var(--font-label);transform:rotate(-6deg);box-shadow:var(--elevation-1)}
@media (max-width:520px){.hero-chip{right:0}}</style></head>
<body><div id="r"></div>
<script type="text/babel" src="SiteChrome.jsx"></script><script type="text/babel" src="HomePage.jsx"></script><script type="text/babel" src="BookPage.jsx"></script>
<script type="text/babel">
function App(){
  const [page,setPage]=React.useState(()=>localStorage.getItem('bdw-site-page')||'home');const [preset,setPreset]=React.useState(null);
  const go=(p,s)=>{setPage(p);if(s)setPreset(s);localStorage.setItem('bdw-site-page',p);window.scrollTo(0,0);};
  return <div><SiteHeader page={page} go={go}/>
    {page==='home'&&<HomePage go={go}/>}
    {page==='services'&&<main><Services go={go} compact/></main>}
    {page==='book'&&<BookPage go={go} preset={preset} key={preset||'b'}/>}
    <SiteFooter go={go}/></div>;
}
ReactDOM.createRoot(document.getElementById('r')).render(<App/>);
</script></body></html>
