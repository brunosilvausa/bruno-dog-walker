<!-- @dsCard group="Depth" viewport="700x200" name="Glow intensities" subtitle="Warm (default), strong, experimental neon" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;margin:0}.c{display:flex;flex-direction:column;gap:10px;align-items:center;font-size:12px;color:var(--text-muted);text-align:center}.p{min-height:48px;padding:0 24px;border-radius:999px;background:var(--bdw-sunshine-hover);font-weight:800;display:inline-flex;align-items:center;color:var(--bdw-cocoa)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start"><div class="c"><span class="p" style="background:var(--bdw-sunshine)">Resting</span>No glow at rest</div><div class="c"><span class="p" style="box-shadow:var(--glow-warm)">--glow-warm</span>0 0 18px rgba(255,206,45,.22)<br>CTA hover, selected</div><div class="c"><span class="p" style="box-shadow:var(--glow-warm-strong)">strong</span>0 0 24px … .38<br>decorative only</div><div class="c"><span class="p" style="box-shadow:var(--glow-neon)">--glow-neon</span>0 0 18px rgba(239,255,0,.22)<br>experimental</div></div><p style="font-size:13px;color:var(--text-muted);margin:16px 0 0">Glow never replaces the 3px #004B75 focus outline, and no border glows permanently.</p></body></html>
