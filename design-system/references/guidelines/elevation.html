<!-- @dsCard group="Depth" viewport="700x200" name="Elevation levels" subtitle="0 flat · 1 resting · 2 hovered · 3 floating" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;margin:0}.b{height:120px;border-radius:16px;background:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;font-size:13px;line-height:1.35;box-sizing:border-box;transition:box-shadow var(--duration-normal) var(--ease-premium),transform var(--duration-normal) var(--ease-premium)}.b b{font:900 18px/1.2 var(--font-sans)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px"><div class="b" style="border:1px solid var(--border-card)"><b>Level 0</b>Flat · hairline #D9CBB5</div><div class="b" style="border:1px solid var(--border-translucent);box-shadow:var(--elevation-1)"><b>Level 1</b>Resting card</div><div class="b" style="border:1px solid var(--border-translucent-strong);box-shadow:var(--elevation-2);transform:translateY(-4px)"><b>Level 2</b>Hovered · −4px</div><div class="b bdw-glass" style="background:var(--glass-background-fallback)"><b>Level 3</b>Nav, overlays</div></div></body></html>
